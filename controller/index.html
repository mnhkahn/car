<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ESP32-S3 BLE 小车遥控</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0;
      background: #0f172a; color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; overflow: hidden;
    }
    h1 { margin: 16px 0 8px; font-size: 1.2rem; }
    #status {
      padding: 6px 14px; border-radius: 20px; background: #334155;
      font-size: 0.85rem; margin-bottom: 12px;
    }
    #status.connected { background: #166534; color: #bbf7d0; }
    .btn {
      border: none; border-radius: 10px; padding: 10px 20px;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
      user-select: none;
    }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }

    .main {
      display: flex; align-items: center; justify-content: center;
      gap: 40px; flex: 1; width: 100%; padding: 0 20px;
    }

    /* Joystick */
    .joystick-area {
      position: relative;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.15);
      touch-action: none;
    }
    .joystick-stick {
      position: absolute;
      top: 50%; left: 50%;
      width: 70px; height: 70px;
      margin: -35px 0 0 -35px;
      border-radius: 50%;
      background: rgba(59,130,246,0.6);
      border: 2px solid rgba(96,165,250,0.8);
      box-shadow: 0 0 20px rgba(59,130,246,0.4);
      transition: transform 0.05s;
      pointer-events: none;
    }
    .joystick-area.active .joystick-stick {
      background: rgba(59,130,246,0.9);
    }

    /* Direction indicator */
    .dir-display {
      text-align: center;
      min-width: 80px;
    }
    .dir-display .label {
      font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px;
    }
    .dir-display .arrow {
      font-size: 2.5rem; line-height: 1;
      transition: all 0.1s;
    }

    .speed-control {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px;
    }
    .speed-slider {
      -webkit-appearance: none; appearance: none;
      width: 160px; height: 8px;
      background: #334155; border-radius: 4px; outline: none;
    }
    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 24px; height: 24px; border-radius: 50%;
      background: #3b82f6; cursor: pointer;
    }

    .log {
      width: 92%; max-width: 420px; height: 100px;
      background: #1e293b; border: 1px solid #334155;
      border-radius: 10px; padding: 8px 10px; font-size: 0.75rem;
      overflow-y: auto; font-family: ui-monospace, SFMono-Regular, monospace;
      margin-bottom: 16px;
    }
    .hint {
      font-size: 0.75rem; color: #64748b; margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1>🚗 ESP32-S3 BLE 小车</h1>
  <div id="status">未连接</div>
  <button id="connectBtn" class="btn btn-primary">连接小车</button>

  <div class="main">
    <div class="joystick-area" id="joystick">
      <div class="joystick-stick" id="stick"></div>
    </div>

    <div class="dir-display">
      <div class="label">方向</div>
      <div class="arrow" id="dirArrow">○</div>
    </div>

    <div class="speed-control">
      <div class="label">速度: <span id="speedVal">200</span></div>
      <input id="speedRange" class="speed-slider" type="range" min="50" max="255" value="200">
    </div>
  </div>

  <div class="hint">手指拖动左侧圆盘控制方向，松手自动停车</div>
  <div class="log" id="log"></div>

<script>
const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX_UUID      = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

let device = null, server = null, rxChar = null;
let connected = false, speed = 200;
let lastCmd = null, lastSendTime = 0;

const statusEl = document.getElementById('status');
const connectBtn = document.getElementById('connectBtn');
const logEl = document.getElementById('log');
const dirArrow = document.getElementById('dirArrow');
const speedRange = document.getElementById('speedRange');
const speedVal = document.getElementById('speedVal');

function log(msg) {
  const line = document.createElement('div');
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

async function connect() {
  if (!navigator.bluetooth) {
    alert('请用 Chrome/Edge 浏览器（支持 Web Bluetooth）');
    return;
  }
  try {
    log('扫描 BLE 设备...');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'ESP32-S3-Car' }],
      optionalServices: [SERVICE_UUID]
    });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    rxChar = await service.getCharacteristic(RX_UUID);
    connected = true;
    statusEl.textContent = '已连接';
    statusEl.classList.add('connected');
    connectBtn.textContent = '断开';
    connectBtn.classList.replace('btn-primary', 'btn-danger');
    log('连接成功');
  } catch (e) {
    log('连接失败: ' + e.message);
  }
}

function disconnect() {
  if (device && device.gatt.connected) device.gatt.disconnect();
}

function onDisconnect() {
  connected = false;
  statusEl.textContent = '已断开';
  statusEl.classList.remove('connected');
  connectBtn.textContent = '连接小车';
  connectBtn.classList.replace('btn-danger', 'btn-primary');
  log('断开');
}

async function send(cmd) {
  if (!connected || !rxChar) return;
  if (cmd === lastCmd && Date.now() - lastSendTime < 200) return; // 200ms内重复指令不发
  lastCmd = cmd;
  lastSendTime = Date.now();
  const fullCmd = cmd + speed;
  try {
    await rxChar.writeValue(new TextEncoder().encode(fullCmd));
    log(`发送 ${fullCmd}`);
  } catch (e) {
    log('发送失败');
  }
}

connectBtn.addEventListener('click', () => {
  connected ? disconnect() : connect();
});

speedRange.addEventListener('input', e => {
  speed = e.target.value;
  speedVal.textContent = speed;
});

// ========== Joystick ==========
const joyArea = document.getElementById('joystick');
const stick = document.getElementById('stick');
const maxDist = 55; // 摇杆最大移动距离(px)
let joyActive = false;

function getAngleDir(dx, dy) {
  const absX = Math.abs(dx), absY = Math.abs(dy);
  const threshold = 0.3; // 死区
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < threshold) return null;

  if (absY > absX) {
    return dy < 0 ? 'F' : 'B';
  } else {
    return dx < 0 ? 'L' : 'R';
  }
}

function updateArrow(cmd) {
  const map = { F: '▲', B: '▼', L: '◀', R: '▶', null: '○' };
  dirArrow.textContent = map[cmd] ?? '○';
}

function handleStart(x, y) {
  joyActive = true;
  joyArea.classList.add('active');
  handleMove(x, y);
}

function handleMove(x, y) {
  if (!joyActive) return;
  const rect = joyArea.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = x - cx, dy = y - cy;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist > maxDist) {
    const ratio = maxDist / dist;
    dx *= ratio; dy *= ratio;
  }
  stick.style.transform = `translate(${dx}px, ${dy}px)`;

  // normalize -1..1
  const ndx = dx / maxDist, ndy = dy / maxDist;
  const cmd = getAngleDir(ndx, ndy);
  updateArrow(cmd);
  if (cmd) send(cmd);
}

function handleEnd() {
  if (!joyActive) return;
  joyActive = false;
  joyArea.classList.remove('active');
  stick.style.transform = 'translate(0px, 0px)';
  updateArrow(null);
  send('S');
}

// Touch
joyArea.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  handleStart(t.clientX, t.clientY);
}, { passive: false });
joyArea.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  handleMove(t.clientX, t.clientY);
}, { passive: false });
joyArea.addEventListener('touchend', e => { e.preventDefault(); handleEnd(); }, { passive: false });
joyArea.addEventListener('touchcancel', e => { e.preventDefault(); handleEnd(); }, { passive: false });

// Mouse
joyArea.addEventListener('mousedown', e => {
  handleStart(e.clientX, e.clientY);
  const move = ev => handleMove(ev.clientX, ev.clientY);
  const up = () => { handleEnd(); window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
});

// Keyboard (WASD / Arrow keys)
const keyMap = { 'ArrowUp':'F','w':'F','W':'F', 'ArrowDown':'B','s':'B','S':'B',
                 'ArrowLeft':'L','a':'L','A':'L', 'ArrowRight':'R','d':'R','D':'R' };
let activeKey = null;
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const cmd = keyMap[e.key];
  if (cmd) { e.preventDefault(); activeKey = cmd; updateArrow(cmd); send(cmd); }
});
window.addEventListener('keyup', e => {
  const cmd = keyMap[e.key];
  if (cmd && activeKey === cmd) { activeKey = null; updateArrow(null); send('S'); }
});
</script>
</body>
</html>
